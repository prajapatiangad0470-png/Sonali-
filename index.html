cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Dearest Sister Sonali / Ishu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); min-height: 100vh; padding: 15px; color: #4a4a4a; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; text-align: center; }
        .main-title { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: #b31217; margin-top: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        .subtitle { font-size: 0.95rem; color: #e63946; margin-bottom: 20px; }
        
        #gridView { display: block; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
        @media(min-width: 500px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        .grid-item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; aspect-ratio: 1; }
        .grid-item:hover { transform: scale(1.03); }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }

        #fullscreenView { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
        .card-container { background: rgba(255, 255, 255, 0.98); padding: 18px; border-radius: 20px; box-shadow: 0 10px 25px rgba(225, 112, 85, 0.4); width: 100%; max-width: 450px; position: relative; }
        .badge { position: absolute; top: 25px; right: 25px; background: #e63946; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; z-index: 10; }
        .image-wrapper { width: 100%; height: 310px; border-radius: 12px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .shayari-box { margin-top: 15px; padding: 14px 16px; background: #fff0f3; border-left: 4px solid #ff4d6d; border-radius: 10px; min-height: 85px; display: flex; align-items: center; justify-content: center; }
        .shayari-box p { font-size: 0.95rem; line-height: 1.6; color: #590d22; font-weight: 500; font-style: italic; white-space: pre-line; text-align: center; }
        .nav-controls { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 20px; background: #ffccd5; color: #590d22; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .primary-btn { background: #ff4d6d; color: white; }
        .back-grid-btn { background: #e0a96d; color: white; margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; }
        footer { margin-top: 15px; font-size: 0.85rem; color: #7209b7; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">For My Sweet Sister Sonali (Ishu) ❤️</h1>
        <p class="subtitle">Tap any photo to view memories & poetry</p>

        <div id="gridView">
            <div class="grid-container" id="gridContainer"></div>
        </div>

        <div id="fullscreenView">
            <div class="card-container">
                <div class="badge" id="photoNumber">1 / 14</div>
                <div class="image-wrapper">
                    <img id="currentImg" src="" alt="Sonali / Ishu">
                </div>
                <div class="shayari-box">
                    <p id="shayariText"></p>
                </div>
                <div class="nav-controls">
                    <button onclick="changeSlide(-1)" class="btn">❮ Previous</button>
                    <button onclick="changeSlide(1)" class="btn primary-btn">Next ❯</button>
                </div>
                <button onclick="closeFullscreen()" class="back-grid-btn">📂 Back to All Photos Grid</button>
            </div>
        </div>

        <footer><p>Made with Endless Love for Sonali (Ishu) 💕</p></footer>
    </div>

    <script>
        const galleryData = [
            { img: "Sonali1.jpg", shayari: "Teri muskaan se roshan mera jahan ho jaye,\nTu jahan bhi rahe bas khushiyan wahan ho jaye." },
            { img: "Sonali2.jpg", shayari: "Bachpan ki wo shararat aur pyaari si ladai,\nSabse anmol hai behan, rab ne jo banai." },
            { img: "Sonali3.jpg", shayari: "Duniya ki har khushi tere kadmon me aaye,\nKabhi bhi tera chehra gham se na murjhaye." },
            { img: "Sonali4.jpg", shayari: "Mushkil raaston me bhi aage badhte jana,\nHar mor par milega tujhe bhai ka sath purana." },
            { img: "Sonali5.jpg", shayari: "Duniya ki is bheed me tu sabse khas hai,\nMera pyar hamesha tere dil ke paas hai." },
            { img: "Sonali6.jpg", shayari: "Bina bole dil ki har baat samajh jati hai,\nMeri behna hi mera sachha hoosla badhati hai." },
            { img: "Sonali7.jpg", shayari: "Tera ye chhota sa gussa aur pyara sa roothna,\nKabhi na tute ye rishta, na rab humse roothna." },
            { img: "Sonali8.jpg", shayari: "Teri aankhon me kabhi aane na dunga paani,\nHamesha khush rahe meri behna rani." },
            { img: "Sonali9.jpg", shayari: "Tere saare sapne ek din sach ho jayein,\nTeri zindagi ke raste phoolon se saj jayein." },
            { img: "Sonali10.jpg", shayari: "Mera har secret tu chupchap chhupati hai,\nMeri behan hi mere sabse zyada kaam aati hai." },
            { img: "Sonali11.jpg", shayari: "Bachpan se lekar aaj tak sath nibhaya hai,\nBehna tune hi har pal mujhe apna banaya hai." },
            { img: "Sonali12.jpg", shayari: "Tu aise hi hamesha khilkhilati rahe,\nKismat teri taaron jaisi chamkati rahe." },
            { img: "Sonali13.jpg", shayari: "Lakhon me ek hai tu meri gudiya pyari,\nSabse alag hai teri meri ye jodi nyari." },
            { img: "Sonali14.jpg", shayari: "Salamat rahe ye rishta hum dono ka hamesha,\nTera bhai rahega tere sath hamesha." }
        ];

        let currentIndex = 0;

        const gridContainer = document.getElementById('gridContainer');
        galleryData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'grid-item';
            div.innerHTML = `<img src="${item.img}" alt="Photo ${index + 1}">`;
            div.onclick = () => openFullscreen(index);
            gridContainer.appendChild(div);
        });

        function openFullscreen(index) {
            currentIndex = index;
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('fullscreenView').style.display = 'flex';
            updateSlide();
        }

        function closeFullscreen() {
            document.getElementById('fullscreenView').style.display = 'none';
            document.getElementById('gridView').style.display = 'block';
        }

        function updateSlide() {
            document.getElementById('currentImg').src = galleryData[currentIndex].img;
            document.getElementById('shayariText').innerText = galleryData[currentIndex].shayari;
            document.getElementById('photoNumber').innerText = `${currentIndex + 1} / ${galleryData.length}`;
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= galleryData.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = galleryData.length - 1;
            updateSlide();
        }
    </script>
</body>
</html>
EOF
