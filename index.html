cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Beloved Sonali / Ishu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); min-height: 100vh; padding: 15px; color: #4a4a4a; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; text-align: center; }
        .main-title { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: #b31217; margin-top: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        .subtitle { font-size: 0.95rem; color: #e63946; margin-bottom: 20px; }
        
        /* Grid View */
        #gridView { display: block; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
        @media(min-width: 500px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        .grid-item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; aspect-ratio: 1; }
        .grid-item:hover { transform: scale(1.03); }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Fullscreen View */
        #fullscreenView { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
        .card-container { background: rgba(255, 255, 255, 0.98); padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(225, 112, 85, 0.4); width: 100%; max-width: 450px; position: relative; }
        .badge { position: absolute; top: 20px; right: 20px; background: #e63946; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; z-index: 10; }
        .image-wrapper { width: 100%; height: 320px; border-radius: 12px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .shayari-box { margin-top: 15px; padding: 12px 15px; background: #fff0f3; border-left: 4px solid #ff4d6d; border-radius: 8px; min-height: 75px; display: flex; align-items: center; justify-content: center; }
        .shayari-box p { font-size: 0.95rem; line-height: 1.5; color: #590d22; font-weight: 500; font-style: italic; }
        .nav-controls { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 20px; background: #ffccd5; color: #590d22; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .primary-btn { background: #ff4d6d; color: white; }
        .back-grid-btn { background: #e0a96d; color: white; margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; }
        
        footer { margin-top: 15px; font-size: 0.85rem; color: #7209b7; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">For My Dearest Sonali (Ishu) ❤️</h1>
        <p class="subtitle">Tap any photo to view memories & shayari</p>

        <!-- Grid Gallery Page -->
        <div id="gridView">
            <div class="grid-container" id="gridContainer"></div>
        </div>

        <!-- Fullscreen Romantic Slider Page -->
        <div id="fullscreenView">
            <div class="card-container">
                <div class="badge" id="photoNumber">1 / 14</div>
                <div class="image-wrapper">
                    <img id="currentImg" src="" alt="Sonali / Ishu">
                </div>
                <div class="shayari-box">
                    <p id="shayariText"></p>
                </div>
                <div class="nav-controls">
                    <button onclick="changeSlide(-1)" class="btn">❮ Previous</button>
                    <button onclick="changeSlide(1)" class="btn primary-btn">Next ❯</button>
                </div>
                <button onclick="closeFullscreen()" class="back-grid-btn">📂 Back to All Photos Grid</button>
            </div>
        </div>

        <footer><p>Made with Endless Love for Sonali (Ishu) 💕</p></footer>
    </div>

    <script>
        const galleryData = [
            { img: "Sonali1.jpg", shayari: "Teri muskurahat hi meri pehchan hai, Sonali tum me hi basi meri jaan hai. ❤️" },
            { img: "Sonali2.jpg", shayari: "Ishu, tum se shuru aur tum par hi khatam, meri har khushi ka rasta bas tum hi ho." },
            { img: "Sonali3.jpg", shayari: "Chaand se bhi pyaara hai Sonali ka chehra, is dil par bas tumhara hi pehra hai. 💕" },
            { img: "Sonali4.jpg", shayari: "Jab se dekha hai Ishu tumhari aankhon me, hum apna dil wahi bhool aaye hain." },
            { img: "Sonali5.jpg", shayari: "Duniya ki sabse khoobsurat shayari ho tum Sonali, jise hum baar baar padhna chahte hain." },
            { img: "Sonali6.jpg", shayari: "Har dua me tera hi naam aata hai Ishu, tum mil gaye to lagta hai zindagani mil gayi." },
            { img: "Sonali7.jpg", shayari: "Sonali, tumhari ek jhalak hi kaafi hai mera poora din banane ke liye. ✨" },
            { img: "Sonali8.jpg", shayari: "Ishu, dil karta hai bass tumhe dekhta rahu, tum meri zindagi ka sabse pyara khwab ho." },
            { img: "Sonali9.jpg", shayari: "Mohabbat ki har ada tumse seekhi hai Sonali, tum mere dil ki dhadkan ho." },
            { img: "Sonali10.jpg", shayari: "Pyaar to bahut log karte hain Ishu, par mera pyaar tumse beinteha aur sabse juda hai. ❤️" },
            { img: "Sonali11.jpg", shayari: "Sonali, jitni khoobsurat tum ho, utni hi khoobsurat meri duniya tumhare aane se hui hai." },
            { img: "Sonali12.jpg", shayari: "Mere har lamhe me bas tera hi zikr hai Ishu, tum se hi mera har kal hai." },
            { img: "Sonali13.jpg", shayari: "Sonali, tum sirf mera pyaar nahi, mera sab kuch ho. 💞" },
            { img: "Sonali14.jpg", shayari: "Hamesha mere sath rehna Ishu, kyunki tumhare bina ye dil adhura hai. 🔥❤️" }
        ];

        let currentIndex = 0;

        // Generate Grid Items
        const gridContainer = document.getElementById('gridContainer');
        galleryData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'grid-item';
            div.innerHTML = `<img src="${item.img}" alt="Photo ${index + 1}">`;
            div.onclick = () => openFullscreen(index);
            gridContainer.appendChild(div);
        });

        function openFullscreen(index) {
            currentIndex = index;
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('fullscreenView').style.display = 'flex';
            updateSlide();
        }

        function closeFullscreen() {
            document.getElementById('fullscreenView').style.display = 'none';
            document.getElementById('gridView').style.display = 'block';
        }

        function updateSlide() {
            document.getElementById('currentImg').src = galleryData[currentIndex].img;
            document.getElementById('shayariText').innerText = galleryData[currentIndex].shayari;
            document.getElementById('photoNumber').innerText = `${currentIndex + 1} / ${galleryData.length}`;
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= galleryData.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = galleryData.length - 1;
            updateSlide();
        }
    </script>
</body>
</html>
EOF
